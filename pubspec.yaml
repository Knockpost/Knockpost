name: knockpost
description: Knockpost - privacy first social media app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  
  video_player: ^2.8.0
  share_plus: ^10.1.4

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.3
  app_links: ^7.0.0
  record: ^6.2.0
  path_provider: ^2.1.5
  pro_image_editor: ^12.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/icon(white).png
    - assets/google.png
    - assets/reaction_default.png
    - assets/test1.jpg
    - assets/test2.jpg
    - assets/test3.jpg
    - assets/test4.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
