name: knockpost
description: Knockpost - privacy first social media app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter


  video_player: ^2.8.0
  ffmpeg_kit_flutter_new: ^4.1.0
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  firebase_core: ^3.11.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.4.3
  app_links: ^7.0.0
  record: ^6.2.0
  path_provider: ^2.1.5
  pro_image_editor: ^12.0.7
  flutter_native_splash: ^2.4.7
  image_cropper: ^12.0.0
  just_audio: ^0.10.5
  camera: ^0.12.0+1
  photo_manager: ^3.9.0
  http: ^1.6.0
  colorfilter_generator: ^0.0.8
  visibility_detector: ^0.4.0+2
  video_thumbnail: ^0.5.6
  font_awesome_flutter: ^11.0.0
  pinch_zoom: ^2.0.1
  extended_image: ^10.0.1
  firebase_messaging: ^15.2.10
  path: ^1.9.1
  flutter_image_compress: ^2.4.0
  video_compress: ^3.1.4
  intl: ^0.20.2
  audioplayers: ^6.6.0
  cloud_functions: ^5.3.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  image: ^4.8.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/los_angeles_effect.frag
    - shaders/aesthetic_blur_effect.frag
    - shaders/low_light_effect.frag
    - shaders/black_white_effect.frag
    - shaders/ultra_hd_effect.frag

  assets:
    - assets/icon.png
    - assets/google.png
    - assets/splash_icon_light.png
    - assets/splash_icon_dark.png
    - assets/reaction_default_light.png
    - assets/reaction_default_dark.png
    - assets/icon(light backgroud).png
    - assets/icon(drak background).png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
